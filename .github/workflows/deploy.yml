name: Deploy Jira Automation

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Build Lambda package
        run: |
          pip install -r requirements.txt -t lambda/
          cp src/jira-automation.sh lambda/
          chmod +x lambda/jira-automation.sh
          cd lambda && zip -r ../lambda_function.zip . && cd ..

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="jira_base=${{ secrets.JIRA_BASE }}" \
            -var="jira_login=${{ secrets.JIRA_LOGIN }}" \
            -var="jira_api_token=${{ secrets.JIRA_API_TOKEN }}" \
            -var="account_id=${{ secrets.ACCOUNT_ID }}" \
            -var="alert_email=${{ secrets.ALERT_EMAIL }}"
